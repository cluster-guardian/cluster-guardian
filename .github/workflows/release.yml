name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Keyless cosign signing via GitHub OIDC.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Subjects for the SLSA provenance job.
      - id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA v1 build provenance for the release archives, attached to the
  # release as multiple.intoto.jsonl (verify with slsa-verifier).
  provenance:
    needs: [goreleaser]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit attestations: SPDX SBOM + SLSA provenance attached to
          # the image manifest.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/andrewkarpaty/cluster-guardian:${{ github.ref_name }}
            ghcr.io/andrewkarpaty/cluster-guardian:latest
      # Keyless signature over the pushed digest; a failure here fails the
      # release — no silent unsigned images.
      - name: Sign image
        run: cosign sign --yes ghcr.io/andrewkarpaty/cluster-guardian@${{ steps.build.outputs.digest }}
